[package]
name = "emendia"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Contextual translation and proofreading for Windows and Linux X11, built with Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
gpui-kit = "=0.7.0"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
raw-window-handle = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
x11rb = { version = "0.13", features = ["randr", "xtest", "xfixes", "xkb", "res"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Globalization",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
