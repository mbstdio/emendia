[package]
name = "emendia"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Contextual translation and proofreading for Windows, built with Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
gpui-kit = "=0.7.0"
global-hotkey = "0.7"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.21", default-features = false }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Globalization",
] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
