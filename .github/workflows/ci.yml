name: Check code

on:
   pull_request:
   push:
      branches: [main]
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
   cancel-in-progress: true

jobs:
   check:
      name: Check ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      strategy:
         fail-fast: false
         matrix:
            os: [windows-2022, ubuntu-24.04]
      env:
         CARGO_TERM_COLOR: always
         CARGO_BUILD_JOBS: "2"
         RUST_TOOLCHAIN: "1.99.0"
      steps:
         - name: Check out the source
           uses: actions/checkout@v6
           with:
              persist-credentials: false

         - name: Configure MSVC
           if: runner.os == 'Windows'
           uses: ilammy/msvc-dev-cmd@v1
           with:
              arch: x64

         - name: Install Linux build dependencies
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y build-essential clang cmake pkg-config \
                libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev \
                libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
                libfontconfig1-dev libfreetype6-dev libwayland-dev libvulkan-dev

         - name: Install Rust
           shell: bash
           run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

         - name: Cache Cargo build files
           uses: Swatinem/rust-cache@v2
           with:
              key: checks-${{ matrix.os }}-rust-1.99

         - name: Check formatting
           shell: bash
           run: cargo "+$RUST_TOOLCHAIN" fmt --all --check

         - name: Run Clippy
           shell: bash
           run: cargo "+$RUST_TOOLCHAIN" clippy --all-targets --locked -- -D warnings

         - name: Run non-interactive tests
           shell: bash
           run: cargo "+$RUST_TOOLCHAIN" test --locked
